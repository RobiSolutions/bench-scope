<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bench-scope</title>
  </head>
  <body>
    <main class="bench">
      <div class="screen" id="screen">
        <canvas class="graticule"></canvas>
        <canvas class="trace"></canvas>
        <div class="readout readout--tl" id="ro-vertical"></div>
        <div class="readout readout--tr">
          <span class="status" id="ro-status"></span>
          <span id="ro-trigger"></span>
        </div>
        <div class="readout readout--bl" id="ro-horizontal"></div>
        <div class="readout readout--br" id="ro-rate"></div>
      </div>

      <aside class="panel">
        <section class="group">
          <h2>Horizontal</h2>
          <div class="stepper">
            <span>Time/div</span>
            <button type="button" data-step="time" data-dir="-1" aria-label="Decrease time per division">−</button>
            <output id="time-per-div"></output>
            <button type="button" data-step="time" data-dir="1" aria-label="Increase time per division">+</button>
          </div>
          <label class="slider">
            <span>Position</span>
            <input id="position" type="range" min="0.1" max="0.9" step="0.01" />
            <output for="position"></output>
          </label>
        </section>

        <section class="group">
          <h2>Vertical</h2>
          <div class="stepper">
            <span>Volts/div</span>
            <button type="button" data-step="volts" data-dir="-1" aria-label="Decrease volts per division">−</button>
            <output id="volts-per-div"></output>
            <button type="button" data-step="volts" data-dir="1" aria-label="Increase volts per division">+</button>
          </div>
        </section>

        <section class="group">
          <h2>Trigger</h2>
          <label class="slider">
            <span>Level</span>
            <input id="level" type="range" min="-4" max="4" step="0.02" />
            <output for="level"></output>
          </label>
          <div class="row">
            <button type="button" class="toggle" id="edge"></button>
            <button type="button" class="toggle" id="noise-reject" aria-pressed="false">Noise reject</button>
          </div>
        </section>

        <section class="group">
          <h2>Measure</h2>
          <dl class="measurements">
            <div><dt>Vpp</dt><dd id="m-vpp">—</dd></div>
            <div><dt>Freq</dt><dd id="m-frequency">—</dd></div>
            <div><dt>Period</dt><dd id="m-period">—</dd></div>
            <div><dt>Duty</dt><dd id="m-duty">—</dd></div>
            <div><dt>Mean</dt><dd id="m-mean">—</dd></div>
            <div><dt>RMS</dt><dd id="m-rms">—</dd></div>
          </dl>
        </section>

        <section class="group">
          <h2>Signal</h2>
          <div class="segmented" role="group" aria-label="Waveform">
            <button type="button" data-kind="sine">Sine</button>
            <button type="button" data-kind="square">Square</button>
            <button type="button" data-kind="pwm">PWM</button>
            <button type="button" data-kind="noise">Noise</button>
          </div>
          <label class="slider">
            <span>Frequency</span>
            <input id="frequency" type="range" min="0" max="6" step="0.01" />
            <output for="frequency"></output>
          </label>
          <label class="slider">
            <span>Amplitude</span>
            <input id="amplitude" type="range" min="0" max="5" step="0.05" />
            <output for="amplitude"></output>
          </label>
          <label class="slider">
            <span>Offset</span>
            <input id="offset" type="range" min="-5" max="5" step="0.05" />
            <output for="offset"></output>
          </label>
          <label class="slider">
            <span>Duty</span>
            <input id="duty" type="range" min="0" max="1" step="0.01" />
            <output for="duty"></output>
          </label>
          <label class="slider">
            <span>Noise</span>
            <input id="noise" type="range" min="0" max="2" step="0.01" />
            <output for="noise"></output>
          </label>
        </section>

        <button type="button" class="run" id="run"></button>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
